[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jihed-skills"
version = "0.1.0"
description = "Command Line Interface to search, discover, and install JihedAiLabs Agent-Ready Engineering Skills."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jihed Ben Arfa", email = "contact@jihedailabs.dev" }
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0"
]

[project.scripts]
jihed-skills = "jihed_skills_cli.cli:main"
